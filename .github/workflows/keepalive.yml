name: Keepalive

# GitHub disables scheduled workflows after 60 days without repo activity.
# Re-enabling them via the API monthly resets that timer without extra commits.

on:
  schedule:
    - cron: '0 4 1 * *'  # Monthly on the 1st at 4 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
    - name: Re-enable all workflows
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        for id in $(gh workflow list --all --json id --jq '.[].id'); do
          gh workflow enable "$id"
          echo "Enabled workflow $id"
        done
